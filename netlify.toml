[build]
  command = "node scripts/patch-superadmin-panel.mjs && node scripts/patch-progress-detail.mjs && node scripts/patch-operacion-panel-v5.mjs && node scripts/fix-paginacion-lista.mjs"
  publish = "."

[[redirects]]
  from = "/"
  to = "/app-v3.html"
  status = 200
  force = true

[[redirects]]
  from = "/index.html"
  to = "/app-v3.html"
  status = 200
  force = true

[[redirects]]
  from = "/superadmin"
  to = "/superadmin.html"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
