[build]
  command = "node scripts/patch-superadmin-panel.mjs && node scripts/patch-progress-detail.mjs && node scripts/patch-operacion-panel-v5.mjs && node scripts/fix-paginacion-lista.mjs && node scripts/patch-ingresado-por.mjs && node scripts/patch-seguridad-panel-v6.mjs && node scripts/patch-seguridad-panel-v6-1.mjs && node scripts/patch-fecha-operativa-v6-3.mjs && node scripts/patch-reporte-empresas-v6-5.mjs && node scripts/patch-reporte-relaciones-v6-6.mjs && node scripts/patch-reporte-acuerdo-mision-v6-7.mjs && node scripts/patch-reporte-cache-v6-8.mjs && node scripts/patch-panel-acuerdo-mision-v6-9.mjs && node scripts/patch-panel-auditoria-relacion-v6-10.mjs && node scripts/patch-contraste-relacion-v6-11.mjs"
  publish = "."

[[redirects]]
  from = "/"
  to = "/app-v3.html"
  status = 200
  force = true

[[redirects]]
  from = "/index.html"
  to = "/app-v3.html"
  status = 200
  force = true

[[redirects]]
  from = "/superadmin"
  to = "/superadmin.html"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
