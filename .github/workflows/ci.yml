name: Validar panel BIOFILE

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-netlify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Patch Super Admin
        run: node scripts/patch-superadmin-panel.mjs
      - name: Patch progreso
        run: node scripts/patch-progress-detail.mjs
      - name: Patch operación v5
        run: node scripts/patch-operacion-panel-v5.mjs
      - name: Verificar paginación
        run: node scripts/fix-paginacion-lista.mjs
      - name: Patch responsable de ingreso
        run: node scripts/patch-ingresado-por.mjs
      - name: Patch seguridad v6
        run: node scripts/patch-seguridad-panel-v6.mjs
      - name: Patch seguridad v6.1
        run: node scripts/patch-seguridad-panel-v6-1.mjs
      - name: Patch fecha operativa v6.3
        run: node scripts/patch-fecha-operativa-v6-3.mjs
      - name: Patch reporte empresas v6.5
        run: node scripts/patch-reporte-empresas-v6-5.mjs
      - name: Patch relaciones Excel v6.6
        run: node scripts/patch-reporte-relaciones-v6-6.mjs
      - name: Patch Acuerdo y Empresa en Misión v6.7
        run: node scripts/patch-reporte-acuerdo-mision-v6-7.mjs
      - name: Patch cache incremental v6.8
        run: node scripts/patch-reporte-cache-v6-8.mjs
      - name: Patch vista Acuerdo y Misión v6.9
        run: node scripts/patch-panel-acuerdo-mision-v6-9.mjs
      - name: Patch auditoría relación BIOFILE v6.10
        run: node scripts/patch-panel-auditoria-relacion-v6-10.mjs
      - name: Patch contraste relación v6.11
        run: node scripts/patch-contraste-relacion-v6-11.mjs
      - name: Patch guía ingreso manual v6.12
        run: node scripts/patch-manual-relacion-biofile-v6-12.mjs
      - name: Patch orden exacto BIOFILE v6.13
        run: node scripts/patch-manual-orden-biofile-v6-13.mjs
      - name: Patch catálogo de paquetes v7
        run: node scripts/patch-panel-catalogo-paquetes-v7.mjs
      - name: Patch carrera ingreso manual v7.2
        run: node scripts/patch-manual-race-v7-2.mjs
      - name: Patch relación con placeholder v7.3
        run: node scripts/patch-relacion-placeholder-v7-3.mjs
      - name: Patch directorio de empresas v7.4
        run: node scripts/patch-superadmin-directorio-v7-4.mjs
      - name: Patch históricos ingresados v7.5
        run: node scripts/patch-historico-ingresados-v7-5.mjs
      - name: Patch fuente histórica legacy v7.6
        run: node scripts/patch-historico-fuente-legacy-v7-6.mjs
      - name: Patch revisión paquetes solo por Órdenes v7.7
        run: node scripts/patch-superadmin-catalogo-v7-7.mjs
      - name: Patch Centro de Control VIP v8
        run: node scripts/patch-centro-control-v8.mjs
      - name: Patch Centro de Control VIP v8.1
        run: node scripts/patch-centro-control-v8-1.mjs
      - name: Patch Centro de Control VIP v8.2
        run: node scripts/patch-centro-control-v8-2.mjs
      - name: Verificar Centro de Control VIP
        run: |
          test -f admin.html
          grep -q "Centro de Control VIP" admin.html
          grep -q "Ir a la página" admin.html
          grep -q "alimentos.vipocupacional.com/login" admin.html
          grep -q "dashboard-alimentos.vipocupacional.com" admin.html
          grep -q "Dashboard alimentos" admin.html
          grep -q "Manipulación de alimentos" admin.html
          grep -q "CENTRO_CONTROL_FRAME_GUARD_V81" admin.html
          grep -q "superadmin.html?embedded=1" admin.html
          grep -q 'from = "/admin"' netlify.toml
      - name: Verificar protecciones y reporte instalados
        run: node scripts/verificar-panel-v7-3.mjs
      - name: Verificar directorio empresas v7.4
        run: node scripts/verificar-directorio-v7-4.mjs
