name: Validar panel BIOFILE

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-netlify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Patch Super Admin
        run: node scripts/patch-superadmin-panel.mjs
      - name: Patch progreso
        run: node scripts/patch-progress-detail.mjs
      - name: Patch operación v5
        run: node scripts/patch-operacion-panel-v5.mjs
      - name: Verificar paginación
        run: node scripts/fix-paginacion-lista.mjs
      - name: Patch responsable de ingreso
        run: node scripts/patch-ingresado-por.mjs
      - name: Patch seguridad v6
        run: node scripts/patch-seguridad-panel-v6.mjs
      - name: Patch seguridad v6.1
        run: node scripts/patch-seguridad-panel-v6-1.mjs
      - name: Patch fecha operativa v6.3
        run: node scripts/patch-fecha-operativa-v6-3.mjs
      - name: Patch reporte empresas v6.5
        run: node scripts/patch-reporte-empresas-v6-5.mjs
      - name: Patch relaciones Excel v6.6
        run: node scripts/patch-reporte-relaciones-v6-6.mjs
      - name: Patch Acuerdo y Empresa en Misión v6.7
        run: node scripts/patch-reporte-acuerdo-mision-v6-7.mjs
      - name: Patch cache incremental v6.8
        run: node scripts/patch-reporte-cache-v6-8.mjs
      - name: Patch vista Acuerdo y Misión v6.9
        run: node scripts/patch-panel-acuerdo-mision-v6-9.mjs
      - name: Patch auditoría relación BIOFILE v6.10
        run: node scripts/patch-panel-auditoria-relacion-v6-10.mjs
      - name: Patch contraste relación v6.11
        run: node scripts/patch-contraste-relacion-v6-11.mjs
      - name: Verificar protecciones y reporte instalados
        run: |
          grep -q 'PANEL_SEGURIDAD_V6' app-v3.html
          grep -q 'PANEL_SEGURIDAD_V61' app-v3.html
          grep -q 'FECHA_OPERATIVA_PANEL_V63' app-v3.html
          grep -q 'FECHA_BIOFILE_ISO' app-v3.html
          grep -q '/api/registros/listar' app-v3.html
          grep -q 'fila:filaDe' app-v3.html
          grep -q 'REVISAR_BIOFILE' app-v3.html
          grep -q 'REPORTE_EMPRESAS_RELACIONES_EXCEL_V66' app-v3.html
          grep -q 'REPORTE_ACUERDO_MISION_V67' app-v3.html
          grep -q 'REPORTE_CACHE_INCREMENTAL_V68' app-v3.html
          grep -q 'PANEL_ACUERDO_MISION_V69' app-v3.html
          grep -q 'PANEL_AUDITORIA_RELACION_V610' app-v3.html
          grep -q 'PANEL_CONTRASTE_RELACION_V611' app-v3.html
          grep -q 'empresa-acuerdo' app-v3.html
          grep -q 'empresa-mision' app-v3.html
          grep -q 'ACUERDO_COMERCIAL_BIOFILE' app-v3.html
          grep -q 'EMPRESA_MISION_BIOFILE' app-v3.html
          grep -q 'ORIGEN_RELACION_EMPRESA' app-v3.html
          grep -q 'Fallback PARTICULARES' app-v3.html
          grep -q 'badgesEmpresaPanelV69' app-v3.html
          grep -q 'Relación empresarial' app-v3.html
          grep -q 'VIP_REPORTE_EMPRESA_' app-v3.html
          grep -q 'ELIMINADO_POR_VISIBLE_V65' app-v3.html
          grep -q 'TEXTILES 1X1' app-v3.html
          grep -q 'MEDYSCOL' app-v3.html
          grep -q 'GESTLAB S.A.S' app-v3.html
          grep -q 'COMFICA COLOMBIA S.A.S.' app-v3.html
          ! grep -q 'const CLAVE_CONSULTA="vip2026"' app-v3.html
