name: Validar panel BIOFILE

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-netlify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verificar fuentes consolidadas
        run: node scripts/verify-build.mjs
      - name: Verificar Centro de Control VIP
        run: |
          test -f admin.html
          grep -q "Centro de Control VIP" admin.html
          grep -q "Ir a la página" admin.html
          grep -q "alimentos.vipocupacional.com/login" admin.html
          grep -q "dashboard-alimentos.vipocupacional.com" admin.html
          grep -q "Dashboard alimentos" admin.html
          grep -q "Manipulación de alimentos" admin.html
          grep -q "CENTRO_CONTROL_FRAME_GUARD_V81" admin.html
          grep -q "superadmin.html?embedded=1" admin.html
          grep -q 'from = "/admin"' netlify.toml
      - name: Verificar protecciones y reporte instalados
        run: node scripts/verificar-panel-v7-3.mjs
      - name: Verificar directorio empresas v7.4
        run: node scripts/verificar-directorio-v7-4.mjs
